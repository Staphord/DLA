{% extends 'accounts/baseaccount.html' %}
{% load static %}

{% block content %}
<div class="auth-wrapper">

  <div class="card auth-card text-center">
    <div class="card-body p-4">
      <div class="mb-3">
        <i class="bi bi-envelope-check text-success" style="font-size: 3rem;"></i>
      </div>
      <h5 class="fw-semibold mb-2">Check your inbox</h5>
      <p class="text-muted small mb-4">
        We've emailed you instructions for resetting your password. If you don't receive them shortly, check your spam folder or make sure you used the correct email address.
      </p>
      <a href="{% url 'login-user' %}" class="btn btn-secondary text-white w-100">Back to Sign In</a>
    </div>
  </div>

</div>
{% endblock %}
