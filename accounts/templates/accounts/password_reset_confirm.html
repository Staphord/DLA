{% extends 'accounts/baseaccount.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 pt-5 mb-light vh-100">
    <div class="card my-5 mx-auto col-md-6">
        <div class="card-body">
            <div class="text-center">
                <div class="text-center py-3">
                </div>
                <div class="text-center">
                    Almost there....
                </div>
                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <!-- Add Bootstrap form-group and form-control classes -->
                    <div class="mt-2 mb-3">
                        <label for="new_password1" class="float-start">New Password:</label>
                        <input type="password" name="new_password1" value="" id="id_new_password1" class="form-control">
                    </div>
                    <div class="mt-2 mb-3">
                        <label for="new_password2" class="float-start">Confirm Password:</label>
                        <input type="password" name="new_password2" id="id_new_password2" class="form-control">
                    </div>
                    
                    <!-- Submit button styled with Bootstrap -->
                    <button type="submit" class="btn btn-secondary text-white w-100">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
