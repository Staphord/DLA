{% extends 'accounts/baseaccount.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 pt-5 mb-light vh-100">
    <div class="card my-5 mx-auto col-md-6">
        <div class="card-body">
            <div class="text-center">
                <div class="text-center py-3">
                </div>
                <div class="text-center">
                    Almost there....
                </div>
                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <!-- New Password Field with Toggle -->
                    <div class="mt-2 mb-3">
                        <label for="new_password1" class="float-start">New Password:</label>
                        <div class="input-group">
                            <input type="password" name="new_password1" value="" id="id_new_password1" class="form-control" required>
                            <button class="btn btn-secondary" type="button" id="togglePassword1">
                                <i class="bi bi-eye" id="eyeIcon1"></i> 
                            </button>
                        </div>
                    </div>
                    
                    <!-- Confirm Password Field with Toggle -->
                    <div class="mt-2 mb-3">
                        <label for="new_password2" class="float-start">Confirm Password:</label>
                        <div class="input-group">
                            <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
                            <button class="btn btn-secondary" type="button" id="togglePassword2">
                                <i class="bi bi-eye" id="eyeIcon2"></i>
                            </button>
                        </div>
                        <!-- Password match indicator -->
                        <div class="invalid-feedback" id="passwordMismatch" style="display: none;">
                            Passwords do not match
                        </div>
                        <div class="valid-feedback" id="passwordMatch" style="display: none;">
                            Passwords match
                        </div>
                    </div>
                    
                    <!-- Submit button styled with Bootstrap -->
                    <button type="submit" class="btn btn-secondary text-white w-100" id="submitBtn">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const password1 = document.getElementById('id_new_password1');
    const password2 = document.getElementById('id_new_password2');
    const submitBtn = document.getElementById('submitBtn');
    const passwordMismatch = document.getElementById('passwordMismatch');
    const passwordMatch = document.getElementById('passwordMatch');
    
    // Password visibility toggle for first password
    document.getElementById('togglePassword1').addEventListener('click', function() {
        togglePasswordVisibility('id_new_password1', 'eyeIcon1');
    });
    
    // Password visibility toggle for second password
    document.getElementById('togglePassword2').addEventListener('click', function() {
        togglePasswordVisibility('id_new_password2', 'eyeIcon2');
    });
    
    // Function to toggle password visibility
    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
    
    // Password validation function
    function validatePasswords() {
        const passwordsMatch = password1.value === password2.value;
        const hasPassword1 = password1.value.length > 0;
        const hasPassword2 = password2.value.length > 0;
        
        // Only show validation feedback if both fields have content
        if (hasPassword1 && hasPassword2) {
            if (passwordsMatch) {
                password2.classList.remove('is-invalid');
                password2.classList.add('is-valid');
                passwordMismatch.style.display = 'none';
                passwordMatch.style.display = 'block';
                submitBtn.disabled = false;
            } else {
                password2.classList.remove('is-valid');
                password2.classList.add('is-invalid');
                passwordMismatch.style.display = 'block';
                passwordMatch.style.display = 'none';
                submitBtn.disabled = true;
            }
        } else {
            // Reset validation classes if either field is empty
            password2.classList.remove('is-valid', 'is-invalid');
            passwordMismatch.style.display = 'none';
            passwordMatch.style.display = 'none';
            submitBtn.disabled = false;
        }
        
        // Set custom validity for HTML5 validation
        if (hasPassword2 && !passwordsMatch) {
            password2.setCustomValidity("Passwords don't match");
        } else {
            password2.setCustomValidity('');
        }
    }
    
    // Add event listeners for real-time validation
    password1.addEventListener('input', validatePasswords);
    password2.addEventListener('input', validatePasswords);
    
    // Prevent form submission if passwords don't match
    document.querySelector('form').addEventListener('submit', function(e) {
        if (password1.value !== password2.value) {
            e.preventDefault();
            validatePasswords();
        }
    });
});
</script>

<style>
/* Custom styles for better UX */
.input-group .btn {
    border-left: 0;
}

.input-group .form-control:focus + .btn {
    border-color: #86b7fe;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}

.is-valid + .btn {
    border-color: #198754;
}

.is-invalid + .btn {
    border-color: #dc3545;
}


/* Smooth transitions */
.form-control {
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.btn {
    transition: all 0.15s ease-in-out;
}
</style>
{% endblock content %}
