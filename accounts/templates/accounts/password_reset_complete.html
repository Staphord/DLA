{% extends 'accounts/baseaccount.html' %}
{% load static %}

{% block content %}
<div class="auth-wrapper">

  <div class="card auth-card text-center">
    <div class="card-body p-4">
      <div class="mb-3">
        <i class="bi bi-shield-check text-success" style="font-size: 3rem;"></i>
      </div>
      <h5 class="fw-semibold mb-2">Password Reset Successful</h5>
      <p class="text-muted small mb-4">Your password has been updated. You can now sign in with your new password.</p>
      <a href="{% url 'login-user' %}" class="btn btn-secondary text-white w-100">Sign In Now</a>
    </div>
  </div>

</div>
{% endblock %}
