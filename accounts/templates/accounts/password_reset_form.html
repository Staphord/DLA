{% extends 'accounts/baseaccount.html' %}
{% load static %}

{% block content %}
<div class="auth-wrapper">

  <div class="text-center mb-4">
    <div class="auth-logo mb-1">RFQSYS</div>
    <div class="auth-subtitle">Reset your password</div>
  </div>

  <div class="card auth-card">
    <div class="card-body p-4">
      <p class="text-muted small mb-3">Enter your email address and we'll send you a link to reset your password.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_email" class="form-label fw-semibold small">Email Address</label>
          <input type="email" name="email" id="id_email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-secondary text-white w-100">Send Reset Link</button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'login-user' %}" class="small text-muted">
          <i class="bi bi-arrow-left me-1"></i>Back to Sign In
        </a>
      </div>
    </div>
  </div>

</div>
{% endblock %}
