{% extends 'accounts/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 pt-5">
    <div class="card my-5 mx-auto col-md-6 w-50">
        <div class="card-body">
            <div class="text-center py-3">
            </div>
            <div class="text-center">
                Enter the Email You Used In Registration, and We Will Send a Reset Link.
            </div>
            <div class="text-center">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mt-2 mb-3">
                        <label for="email" class="float-start">Email:</label>
                        <input type="email" name="email" id="id_email" class="form-control">
                    </div>
                    
                    <button type="submit" class="btn btn-secondary text-white w-50">Request Reset Link</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
