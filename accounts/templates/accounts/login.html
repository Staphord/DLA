{% extends 'accounts/baseaccount.html' %}
{% load static %}

{% block content %}
<section class="bg-light py-5 vh-100">
  <div class="container mt-5 pt-5">
    <div class="row">
      <!-- Left Column -->
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              <div class="bg-light p-2 mb-2 form-text rounded-2">Login to RFQ Automated Portal</div>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" name="username" id="username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" name="password" id="password">
                  <button class="btn btn-secondary password-toggle-btn" type="button" style="z-index: 10; position: relative;">
                    <i class="bi bi-eye" style="pointer-events: none;"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn mybg hoverbg text-white w-100 mt-1">Login</button>
              <div class="mt-2">
               <a href='{% url 'password_reset' %}' class=''>Forgot Password?</a>      
              </div> <br>
              <div class="mt-2">
                <div class="d-flex">
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- Right Column -->
      <div class="col-md-6 py-1">
        <!-- First Row -->
        <div class="row gap-2 mb-3 mx-1">
          <div class="col-12 col-sm myhover my-border text-center my-text d-flex justify-content-center align-items-center">
            <div class="d-block">
              <div class="">What is RFQSYS?</div>
              <div><i class="ri-questionnaire-line fs-3"></i></div>
            </div>
          </div>
          <div class="col-12 col-sm myhover my-border my-text text-center d-flex justify-content-center align-items-center">
            <div class="d-block text-center">
              <div class="">How to Use</div>
              <div><i class="ri-macbook-line fs-3"></i></div>
            </div>
          </div>
        </div>
        <!-- Second Row -->
        <div class="row gap-2 mx-1">
          <div class="col-12 myhover col-sm my-border text-center my-text d-flex justify-content-center align-items-center">
            <div class="d-block">
              <div class="">Advantages of Using RFQSYS</div>
              <div><i class="ri-team-line fs-3"></i></div>
            </div>
          </div>
          <div class="col-12 col-sm myhover my-border my-text text-center d-flex justify-content-center align-items-center">
            <div class="d-block">
              <div class="">Pricing</div>
              <div><i class="ri-money-dollar-circle-line fs-3"></i></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Vendor JS Files -->
<script src="{% static 'solicitations/assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

<script>
// Password toggle functionality
function togglePassword(fieldId, button) {
    console.log('togglePassword called!');
    
    const passwordField = document.getElementById(fieldId);
    const icon = button.querySelector('i');
    
    if (!passwordField || !icon) {
        console.error('Missing elements:', { passwordField, icon });
        return;
    }
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
        button.setAttribute('title', 'Hide password');
        console.log('Password shown');
    } else {
        passwordField.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
        button.setAttribute('title', 'Show password');
        console.log('Password hidden');
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    console.log('Setting up password toggle...');
    
    // Find button and add event listener
    const button = document.querySelector('.password-toggle-btn');
    
    if (button) {
        console.log('Button found, adding click handler');
        
        // Remove any existing listeners and add new one
        button.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('Button clicked!');
            togglePassword('password', this);
            return false;
        };
        
        // Also try with addEventListener as backup
        button.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('addEventListener triggered');
            togglePassword('password', this);
        }, true);
        
        // Set initial state
        button.setAttribute('title', 'Show password');
        button.style.cursor = 'pointer';
        
        console.log('Password toggle setup complete');
    } else {
        console.error('Toggle button not found');
    }
});
</script>

<style>
/* Password toggle button styling */
.password-toggle-btn {
    border-left: 0 !important;
    cursor: pointer !important;
    z-index: 10;
    position: relative;
    min-width: 40px;
    padding: 0.375rem 0.75rem;
}

.password-toggle-btn:hover {
    background-color: #f8f9fa !important;
    border-color: #adb5bd !important;
}

.password-toggle-btn:focus {
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25) !important;
}

.password-toggle-btn i {
    pointer-events: none;
    font-size: 1rem;
}

.input-group .btn-outline-secondary,
.input-group .btn-secondary {
    border-left: 0;
    cursor: pointer;
}

.input-group .form-control:focus + .btn-outline-secondary,
.input-group .form-control:focus + .btn-secondary,
.input-group .form-control:focus + .password-toggle-btn {
    border-color: #86b7fe;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}

/* Ensure password fields have proper styling */
.input-group .form-control {
    border-right: 0;
}

.input-group .form-control:focus {
    border-right: 0;
    box-shadow: none;
}

/* Hover effect for toggle button */
.input-group .btn-outline-secondary:hover,
.input-group .btn-secondary:hover {
    
}

/* Fix for input group border alignment */
.input-group .form-control:not(:last-child) {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
}

.input-group .btn:not(:first-child) {
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
}
</style>
{% endblock content %}
