{% extends 'solicitations/base.html' %}

{% load static %}

{% block content %}
<section class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 100vh;">
    <div class="mb-1">
        <img src="{% static 'solicitations/assets/img/cron.png' %}" alt="" class="w-75">
    </div>
    <div class="mt-3">
        <form method="post">
            {% csrf_token %}
            <div class="row justify-content-center">
               <div class="col d-flex gap-3">
                <input type="text" name="cron_schedule" value="0 1 * * *" class="form-control text-center w-100"  required id="id_cron_schedule">
                <button type="submit" class="btn btn-warning text-white mt-2">Update</button>
               </div>
            </div>
        </form>
    </div>    
</section>
{% endblock content %}
