{% extends 'solicitations/registration/baseaccount.html' %}
{% load static %}
{% block content %}
<section class="py-5 vh-100">
    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header">
                        <h3>Invite Client</h3>
                    </div>
                    <div class="card-body">
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="email">Email address</label>
                                <input type="email" class="form-control" id="email" name="email"
                                       required placeholder="Enter client email"
                                       value="{{ entered_email|default:'' }}">
                            </div>
                            <div class="mt-3 text-center d-flex justify-content-end gap-3">
                                <div class="">
                                    <a href="{% url 'solicitations:clients' %}" class="btn btn-secondary">Back to Clients</a>
                                </div>
                                <div class="">
                                    <button type="submit" class="btn mybg hoverbg text-white">Send Invitation</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
