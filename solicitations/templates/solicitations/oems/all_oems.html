{% extends 'solicitations/base.html' %}

{% load static %}

{% block content %}

<section>
    <div class="d-flex justify-content-between">
        <div class="">
            <div class="mt-3">
                Total OEMS <span class="badge bg-light text-dark">{{total_oems}}</span>
            </div>
        </div>
        <div class="d-flex gap-3">
            <form action="#" method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <input type="text" name="search" class="form-control" placeholder="Search by Cage Code...">
                    <button type="submit" class="btn mybg myhover"><i class="bi bi-search text-white"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="my-4">
        <div class="card">
            <div class="card-body my-3">
                <table class="table table-sm table-hover">
                    <thead class="table-light">
                      <th class="text-secondary">Cage Code</th>
                      <th class="text-secondary">Name</th>
                      <th class="text-secondary">City</th>
                      <th class="text-secondary">Phone</th>
                      <th class="text-secondary">Operation</th>
                    </thead>
                    <tbody>
                        {% for oem in oems %}
                        <tr>
                            <td>{{oem.cage}}</td>
                            <td>{{oem.name|title}}</td>
                            <td>{{oem.city|title}}</td>
                            <td>{{oem.phone}}</td>
                            <td><a href="{% url 'solicitations:oem-detail' oem.id %}" class="btn mybg hoverbg text-white">View More</a></td>
                          </tr>
                        {% endfor %}
                    </tbody>
                  </table>
<!--
                  <div class="text-center" data-aos="fade-up" data-aos-delay="300">
                    <div class="ms-1 rounded me-1 container mt-3 d-flex justify-content-center pagination">
                        {% if rfq.has_previous %}
                          <li><a class="page-link text-secondary" href="?page={{rfq.previous_page_number}}">&laquo Previous</a></li>
                        {% endif %}
                        
                        <li class="page-item page-link text-secondary">page {{rfq.number}} of {{rfq.paginator.num_pages}}</li>
                
                        {% if rfq.has_next %}
                          <li><a class="page-link text-secondary" href="?page={{rfq.next_page_number}}">next &raquo</a></li>
                        {% endif %}
                      </div>
                  </div>
                  -->
            </div>
        </div>
    </div>
</section>

{% endblock content %}
